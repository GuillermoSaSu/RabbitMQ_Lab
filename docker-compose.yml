version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-lab
    ports:
      - "5672:5672"   # puerto AMQP (donde tus apps .NET se conectan)
      - "15672:15672" # interfaz web de gestión
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest